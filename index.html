<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/reset.css">
    <link rel="stylesheet" href="style/style.css">
    <script type="module" src="js/main.js" defer></script>
    <title>Lion School</title>
</head>

<body>

    <header>
        <div class="header-logo">
            <img src="assents/logo.svg" alt="logo lion-school">
            <div class="sair">
                <img src="assents/Vector.svg" alt="botão de sair">
                <h1>Sair</h1>
            </div>
        </div>

        <div class="header-status">
            <div class="status">
                <details>
                    <summary>
                        <p style="display:inline;">Status</p>
                    </summary>
                    <ul>
                        <li>Cursando</li>
                        <li>Finalizado</li>
                    </ul>
                </details>
            </div>
            <div class="legenda">
                <p>Legenda</p>
                <div class="cursando">
                    <div class="corCursando"></div>
                    <p>Cursando</p>
                </div>
                <div class="finalizado">
                    <div class="corFinalizado"></div>
                    <p>Finalizado</p>
                </div>
            </div>
        </div>
    </header>
    <main class="main-home" id="main">
        <div class="hero-alunos">
            <h1>Desenvolvimento de sistemas</h1>
        </div>
    </main>
    <footer>
        <div class="contatos">
            <div class="telefone">
                <img src="assents/phone.svg" alt="">
                <span>(11) 4774-4700</span>
            </div>
            <div class="email">
                <img src="assents/icon-email.svg" alt="">
                <span>lionschool@gmail.com</span>
            </div>
            <div class="local">
                <img src="assents/local.svg" alt="">
                <span>Rua tcc, 211, Centro, Jandira</span>
            </div>
        </div>
        <div class="copyright">
            <span>Copyright © 2026 | Fernando Leonid
            </span>
        </div>
        <div class="redes-sociais">
            <div class="borda">
                <img src="assents/youtube.svg" alt="">
            </div>
            <div class="borda">
                <img src="assents/twitter.svg" alt="">
            </div>
            <div class="borda">
                <img src="assents/instagram.svg" alt="">
            </div>
            <div class="borda">
                <img src="assents/facebook.svg" alt="">
            </div>
        </div>
    </footer>
</body>

</html>
